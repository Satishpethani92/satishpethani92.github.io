<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Gradient border ring -->
  <circle cx="50" cy="50" r="50" fill="url(#border)"/>
  <!-- Background -->
  <circle cx="50" cy="50" r="47" fill="#050b18"/>
  <!-- Profile image clipped to circle -->
  <image href="/avatar.jpg" x="2" y="2" width="96" height="96" clip-path="url(#circle)" preserveAspectRatio="xMidYMid slice"/>
</svg>